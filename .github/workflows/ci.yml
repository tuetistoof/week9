name: Java CI with Maven

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # SỬA LẠI: Chui thẳng vào thư mục chứa pom.xml rồi mới chạy lệnh để Surefire tìm đúng class test
      - name: Build and Run Specific Test with Maven
        run: |
          cd wk9/9.3
          mvn clean package -Dtest=AppTest

      # Upload toàn bộ thư mục target của bài 9.3 lên Artifacts
      - name: Upload Build Artifact (.jar)
        uses: actions/upload-artifact@v4
        with:
          name: execution-jar
          path: wk9/9.3/target/