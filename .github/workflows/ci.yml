name: Java CI with Maven

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - '9.3/**'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - '9.3/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      # Chạy build dự án, nếu muốn bỏ qua lỗi checkstyle/test để nó pass xanh trước, bạn có thể dùng:
      # run: mvn clean package -Dcheckstyle.skip=true -DskipTests
      - name: Build with Maven (Checkstyle, Test and Package)
        working-directory: ./9.3
        run: mvn clean package

      # ĐỀ BÀI YÊU CẦU: Triển khai action upload-artifact để lưu giữ tệp .jar
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bank-system-jar
          path: 9.3/target/*.jar