name: Java CI with Maven

# Cấu hình để workflow CHỈ chạy khi có thay đổi trong thư mục 9.3
on:
  push:
    branches: [ "main", "master" ]
    paths:
      - '9.3/**' # Chỉ kích hoạt khi có sự thay đổi file bên trong thư mục 9.3
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - '9.3/**' # Tương tự với pull request

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # Di chuyển vào thư mục 9.3 để thực hiện lệnh build và test
      - name: Build with Maven (Checkstyle, Test and Package)
        working-directory: ./9.3
        run: mvn clean package

      # Chỉ lấy file .jar sinh ra từ thư mục 9.3 đem đi cất (Artifact)
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bank-system-jar
          path: 9.3/target/*.jar